name: Build

# CI for this repository (AGENTS.md §6). It builds FrontierOutpost.slnx at Debug|x64 for every pull
# request to main and every push to main.
#
# ── What it gates, and what it skips ───────────────────────────────────────────────────────────
#
# AGENTS.md §6 guards every gate on the file it needs, so a gate starts blocking the day its input
# lands, and a gate whose input does not exist yet is skipped, not faked:
#
#   Build/CheckProjectFiles.py   the build-shape check           not written yet: skipped
#   FrontierOutpost.slnx         the build                       runs
#   *Tests.dll in the output     the test suites                 none yet: skipped
#   Build/RunClangTidy.py        clang-tidy                      not written yet: skipped
#   Build/CheckFormat.py         clang-format (its own job)      not written yet: skipped
#
# When the checkers are written, they must leave FrontierOutpost/ and GameData/ alone (ADR-001,
# ADR-004).
#
# ── Why the build does not treat warnings as errors ───────────────────────────────────────────
#
# FrontierOutpost/ is a legacy import. It builds at the original's /W3, with the original's own
# warnings (589 at x64, the same as the original's own build: MIGRATION_NOTES.md §15.6), and
# ADR-001 exempts it from /W4 /WX. MSBuild's /warnaserror would turn every one of them into an
# error, so it is not passed.
#
# ── What it does not build ─────────────────────────────────────────────────────────────────────
#
# Debug and x64 only (AGENTS.md §3, §6). Release and ARM64 are built by the migration workflow
# (migration.yml) while the migration lasts, and before a release by whoever ships.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Debug|x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # MSBuild through vswhere, as the migration brief asks, rather than from a setup action.
      - name: Find MSBuild and record the toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -prerelease -products * -property installationPath
          if (-not $install) { throw "vswhere found no Visual Studio installation." }
          $msbuild = & $vswhere -latest -prerelease -products * -requires Microsoft.Component.MSBuild `
            -find 'MSBuild\**\Bin\amd64\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw "vswhere found no MSBuild." }
          "MSBUILD_EXE=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "runner image : $env:ImageOS / $env:ImageVersion"
          Write-Output "visual studio: $install"
          Write-Output "msbuild      : $msbuild, version $(& $msbuild -version -nologo | Select-Object -Last 1)"

      - name: Check the build shape and the project registries
        if: hashFiles('Build/CheckProjectFiles.py') != ''
        shell: pwsh
        run: python Build\CheckProjectFiles.py

      - name: Build
        if: hashFiles('FrontierOutpost.slnx') != ''
        shell: pwsh
        run: |
          & $env:MSBUILD_EXE FrontierOutpost.slnx /p:Configuration=Debug /p:Platform=x64 `
            /m /nologo /v:minimal /clp:ErrorsOnly "/flp:LogFile=build.log;Verbosity=normal"
          $code = $LASTEXITCODE
          Select-String -Path build.log -Pattern '^\s*\d+ Warning\(s\)|^\s*\d+ Error\(s\)|^\s*Time Elapsed' |
            ForEach-Object { $_.Line.Trim() }
          if ($code -ne 0) { throw "MSBuild failed with exit code $code." }

      # vstest reports "no tests found" as a pass (AGENTS.md §3), so an empty run proves nothing:
      # the suites are found first, and there must be at least one.
      - name: Run the tests
        shell: pwsh
        run: |
          $suites = @(Get-ChildItem -Path FrontierOutpost\bin\x64\Debug, x64\Debug -Filter '*Tests.dll' `
            -File -ErrorAction SilentlyContinue | ForEach-Object FullName)
          if (-not $suites) {
            Write-Output "No test suite is built yet; nothing to run."
            exit 0
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere -latest -products * -find '**\vstest.console.exe' | Select-Object -First 1
          if (-not $vstest) { throw "vstest.console.exe not found." }
          & $vstest $suites /Platform:x64 /Logger:trx /ResultsDirectory:TestResults
          if ($LASTEXITCODE -ne 0) { throw "vstest reported failures." }

      # After the build, so that a compile error is reported as a compile error rather than as
      # linter findings about a file that does not parse.
      - name: Run clang-tidy
        if: hashFiles('Build/RunClangTidy.py') != ''
        shell: pwsh
        run: python Build\RunClangTidy.py

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Ubuntu's own Python refuses pip installs into itself; setup-python's does not.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The version Visual Studio 2026 bundles, so that CI and a developer's machine agree.
      - name: Check formatting
        if: hashFiles('Build/CheckFormat.py') != ''
        run: |
          pip install --disable-pip-version-check --quiet clang-format==22.1.3
          python Build/CheckFormat.py --clang-format clang-format
