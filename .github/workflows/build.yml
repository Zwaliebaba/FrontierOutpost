name: Build

# CI for LockStep: Universe (AGENTS.md §6). Every step of the three gate jobs blocks; the two that
# publish the download gate nothing and are gated by all three.
#
# ── What this builds, and what it deliberately does not ────────────────────────────────────
#
# DEBUG ONLY (owner decision, 2026-09-09). The Windows build is the slow half of the pipeline and
# a second configuration roughly doubles it, for a tree where Debug and Release differ in exactly
# four things: Optimization, _DEBUG vs NDEBUG, FunctionLevelLinking/IntrinsicFunctions, and the
# linker's folding and LTCG switches. What stands in for the missing build is the "Check the build
# shape" step below: Build/CheckProjectFiles.py fails when Debug and Release drift apart on any
# setting that is not about optimisation, so the Release nobody compiles here still cannot quietly
# lose an include directory or sit on an older language standard. Before a release, somebody
# builds Release for real -- see AGENTS.md §3.
#
# X64 ONLY. There is no second platform to fall back on and nothing left to excuse a red x64.
#
# ── Where the executable ends up ───────────────────────────────────────────────────────────
#
# A green tick proves the tree compiles. It puts nothing in anybody's hands. Two jobs at the
# bottom of this file -- `package` and `publish` -- build Lockstep.exe at RELEASE and attach it
# to a GitHub Release, so that somebody who has never seen this repository can get the game from
# its front page (ADR-110). They are the only jobs here that gate nothing, and the only ones
# that need more than `contents: read`.
#
# ── Why the toolchain is not pinned to an image ────────────────────────────────────────────
#
# PlatformToolset (v145) is pinned in the .vcxproj files. The runner image is not: it is whatever
# GitHub ships, and a wrong image pin trades a floating toolchain for a build that does not run at
# all. Instead the first step of each job PRINTS what it got -- image, VS, MSBuild, clang-tidy,
# clang-format -- so a pin can be taken from evidence the day one is wanted, and so "it broke and
# nothing changed" has somewhere to look.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Debug|x64
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      CONFIGURATION: Debug
      PLATFORM: x64

      # ── Why clang-tidy is pinned and the rest of the toolchain is not ──────────────────────
      #
      # The clang-format job below pins an exact clang-format and says why: two releases break a
      # long argument list in different places, so a floating version would flap. clang-tidy floated,
      # and on 2026-09-11 it flapped -- the runner image moved to LLVM 20.1.8 and the build went
      # red on code that had not changed, with three findings in two families:
      #
      #   clang-analyzer-optin.core.EnumCastOutOfRange on SystemFlags, a BIT-FLAG enum where
      #   Capital|Contested is 3 and no enumerator has that value. Deliberate, correct, and not
      #   reported by 22.
      #
      #   clang-analyzer-cplusplus.NewDeleteLeaks on a std::unique_ptr inside an aggregate
      #   returned by value. Correct C++, and not reported by 22 either.
      #
      # A third finding from the same run was REAL -- MessageKind had no zero enumerator and the
      # decoder cast one in -- and it is fixed in the code rather than pinned away. That is the
      # distinction this pin is drawn on: a version change should not be able to turn main red on
      # its own, and the way to bump it is to change the number here, run it, and fix what it says.
      #
      # From pip rather than from the image, because that is the only way a developer can run the
      # same binary the gate runs. `python -m pip install clang-tidy==<this>` gets it on any
      # machine; the runner's bundled LLVM cannot be asked for by version at all.
      CLANG_TIDY_VERSION: 22.1.8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # INCLUDE and LIB are what make the CRT and the Windows SDK visible to clang-tidy, which
      # runs through clang's MSVC driver rather than being told about the SDK by hand. MSBuild
      # does not need them -- it resolves the toolset itself -- so this exists for the linter.
      - name: Import the MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -property installationPath
          if (-not $install) { throw "vswhere found no Visual Studio installation." }
          $devcmd = Join-Path $install 'Common7\Tools\VsDevCmd.bat'
          cmd /c "`"$devcmd`" -arch=amd64 -host_arch=amd64 -no_logo && set" | ForEach-Object {
            if ($_ -match '^(INCLUDE|LIB|LIBPATH|VCINSTALLDIR|VCToolsInstallDir|VSINSTALLDIR)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          "VSWHERE_INSTALL=$install" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # PINNED, and not taken from the runner image. CLANG_TIDY_VERSION at the top of this job
      # carries the version and the reason.
      - name: Install the pinned clang-tidy
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "clang-tidy==$env:CLANG_TIDY_VERSION"

      - name: Record the toolchain
        shell: pwsh
        run: |
          Write-Output "runner image : $env:ImageOS / $env:ImageVersion"
          Write-Output "visual studio: $env:VSWHERE_INSTALL"
          msbuild -version -nologo
          Write-Output "--- clang-tidy (pinned to $env:CLANG_TIDY_VERSION) ---"
          clang-tidy --version
          Write-Output "--- python ---"
          python --version

      # First, because it is two seconds and it catches the class of mistake that would otherwise
      # surface as a confusing build failure: a file missing from a project, a header in a
      # subdirectory clang-tidy will never see, or Debug and Release drifting apart.
      - name: Check the build shape and the project registries
        shell: pwsh
        run: python Build\CheckProjectFiles.py

      # /warnaserror covers MSBuild's own warnings; /WX for the compiler is set in the projects.
      - name: Build
        shell: pwsh
        run: |
          msbuild Lockstep.slnx `
            /p:Configuration=$env:CONFIGURATION /p:Platform=$env:PLATFORM `
            /m /nologo /v:minimal /warnaserror `
            /flp:LogFile=build.log`;Verbosity=normal

      - name: Run the tests
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere -latest -products * -find '**\vstest.console.exe' | Select-Object -First 1
          if (-not $vstest) { throw "vstest.console.exe not found." }
          $suites = @(
            "x64\$env:CONFIGURATION\NeuronCoreTests.dll",
            "x64\$env:CONFIGURATION\NeuronClientTests.dll",
            "x64\$env:CONFIGURATION\NeuronServerTests.dll",
            "x64\$env:CONFIGURATION\GameLogicTests.dll",
            "x64\$env:CONFIGURATION\LockstepTests.dll"
          )
          foreach ($suite in $suites) {
            if (-not (Test-Path $suite)) { throw "$suite was not built. A suite that does not exist is not a suite that passed." }
          }
          & $vstest $suites /Platform:x64 /Logger:trx /ResultsDirectory:TestResults
          if ($LASTEXITCODE -ne 0) { throw "vstest reported failures." }

      # After the build, so that a compile error is reported as a compile error rather than as
      # forty linter findings about a file that does not parse.
      - name: Run clang-tidy
        shell: pwsh
        run: python Build\RunClangTidy.py

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  # ── Release, for the one suite that can tell ─────────────────────────────────────────────────
  #
  # CI builds Debug because the Windows build is the slow half of this pipeline and a second
  # configuration doubles it (owner decision, 2026-09-09). What changed is that there is now
  # something Release can DISAGREE about: the scripted match's final hash is pinned to a value
  # computed under clang, so a Release build that optimises the simulation into a different answer
  # fails here rather than on the day somebody ships.
  #
  # `GameLogicTests` only, and deliberately. It is the suite that holds the determinism gate, it
  # needs `GameLogic` and `NeuronCore` and nothing else, and it runs in parallel with the Debug job
  # so the wall clock is unchanged. The rest of the tree is still covered by the static alignment
  # check in CheckProjectFiles.py, which is what stands in for the build nobody runs.
  release:
    name: Release|x64 (determinism)
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      CONFIGURATION: Release
      PLATFORM: x64

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build GameLogicTests
        shell: pwsh
        run: |
          msbuild Lockstep.slnx /t:Tests\GameLogicTests `
            /p:Configuration=$env:CONFIGURATION /p:Platform=$env:PLATFORM `
            /m /nologo /v:minimal /warnaserror

      - name: Run the determinism gate
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere -latest -products * -find '**\vstest.console.exe' | Select-Object -First 1
          if (-not $vstest) { throw "vstest.console.exe not found." }

          $suite = "x64\$env:CONFIGURATION\GameLogicTests.dll"
          if (-not (Test-Path $suite)) { throw "$suite was not built. A suite that does not exist is not a suite that passed." }

          & $vstest $suite /Platform:x64
          if ($LASTEXITCODE -ne 0) { throw "vstest reported failures." }

  format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Its own Linux job, and not a step on the Windows one, for two reasons. It is seconds rather
    # than minutes, so it reports a formatting problem long before the build would have. And the
    # version is an EXACT one here: `windows-latest` has clang, both a standalone LLVM and whatever
    # Visual Studio bundles, but both move when the image does -- which is how clang-tidy went red
    # on 2026-09-11 (see the Windows job above).
    #
    # ── Why 22.1.3, and why from pip ──────────────────────────────────────────────────────────
    #
    # **The pinned version is the one Visual Studio 2026 bundles**, and that is the whole point of
    # the number rather than a preference for a newer release. Releases disagree: 18 puts a wrapped
    # lambda's opening brace on the same line and 22 puts it on its own. Whichever version CI uses,
    # a developer whose local clang-format differs is running a check that cannot tell them
    # anything -- and on 2026-09-13 that is exactly what happened. CI pinned 18, this tree's Visual
    # Studio shipped 22.1.3, `CheckFormat.py` was green locally, and main went red on a lambda.
    #
    # So the pin follows the common local tool. When Visual Studio moves, re-pin deliberately: the
    # number here, `PINNED_VERSION` in `Build/CheckFormat.py`, and the table in `AGENTS.md` §6.
    #
    # From pip rather than apt because apt has what Ubuntu chose (18 on 24.04) and pip has the
    # version this asks for, on any image. `setup-python` is what makes `pip install` work at all:
    # Ubuntu's system Python is externally managed and refuses to install into itself.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang-format
        run: pip install clang-format==22.1.3

      - name: What this got
        run: clang-format --version

      - name: Check formatting
        run: python Build/CheckFormat.py --clang-format clang-format

  # ── The download, and why it is a second Release build ───────────────────────────────────────
  #
  # RELEASE, and that is the whole reason this job exists instead of the Debug job uploading what
  # it already built. A Debug binary links the debug CRT -- ucrtbased.dll, vcruntime140d.dll,
  # msvcp140d.dll -- which Microsoft does not permit to be redistributed and which exists only on a
  # machine with Visual Studio on it. Handed to anybody else it dies on a missing-DLL dialog before
  # WinMain runs. What a stranger can run is a Release build or it is nothing.
  #
  # It is also the Release build of the APPLICATION that nothing here used to do. The determinism
  # job above builds GameLogicTests at Release, which reaches two libraries; Lockstep, NeuronClient,
  # NeuronServer and LockstepClient were compiled at Debug only, so a break that needed /O2 or LTCG
  # to show up surfaced on the day somebody shipped. AGENTS.md §3 covered that with "before a
  # release, somebody builds Release for real". Now every push to main does.
  #
  # Parallel with the two gate jobs and gated by neither, deliberately: it must not add its build to
  # the wall clock, and nothing it produces is PUBLISHED until `publish` below has seen all three
  # gates go green. Skipped on pull requests, which have nothing to ship.
  package:
    name: Release|x64 (Lockstep.exe)
    runs-on: windows-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request'

    env:
      CONFIGURATION: Release
      PLATFORM: x64

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # /t:Lockstep, through the solution. AGENTS.md §3: a .vcxproj built directly resolves
      # $(SolutionDir) against the project folder and puts its output somewhere else entirely.
      - name: Build Lockstep
        shell: pwsh
        run: |
          msbuild Lockstep.slnx /t:Lockstep `
            /p:Configuration=$env:CONFIGURATION /p:Platform=$env:PLATFORM `
            /m /nologo /v:minimal /warnaserror

      # An executable that is not there is not an executable that built, and upload-artifact's
      # default for a path that matches nothing is a warning nobody reads. The hash is printed so
      # that what the release serves can be checked against what the build produced.
      - name: Check that there is an executable
        shell: pwsh
        run: |
          $exe = "x64\$env:CONFIGURATION\Lockstep.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not built." }
          Write-Output "$exe  $([math]::Round((Get-Item $exe).Length / 1KB)) KB"
          Write-Output "sha256: $((Get-FileHash $exe -Algorithm SHA256).Hash.ToLower())"

      - name: Hand the executable to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: lockstep-exe
          path: x64/${{ env.CONFIGURATION }}/Lockstep.exe
          if-no-files-found: error

  # ── Publishing it where a stranger can reach it ──────────────────────────────────────────────
  #
  # A WORKFLOW ARTIFACT IS NOT A DOWNLOAD. It hangs off a workflow run, never appears on the
  # repository's front page, is re-zipped whatever it holds, expires after 90 days, and -- public
  # repository or not -- cannot be fetched without a GitHub login. The build log and the test
  # results above are artifacts because their reader is whoever is debugging the run. The
  # executable is not, because its reader has never seen this repository.
  #
  # A Release asset is the opposite on every count: anonymous, permanent, served under a URL that
  # can be linked, and listed in the sidebar of the front page. ADR-110 takes two channels of them:
  #
  #   a v* tag  ->  a versioned Release, one entry per version, never rewritten
  #   a main push  ->  `latest-build`, a PRERELEASE deleted and recreated at the new commit
  #
  # Prerelease is what keeps the two apart. GitHub's "Latest" badge and the /releases/latest
  # redirect both skip prereleases, so the day a real version exists the rolling build stops being
  # what the front page offers without stopping being available.
  #
  # `needs` is the gate, and it is the only thing standing between a red tree and a public
  # download: three green jobs or nothing is published. Linux, because all this job runs is `gh`.
  publish:
    name: Publish the download
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [windows, release, format, package]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    # The one place this workflow needs more than the `contents: read` at the top of the file, and
    # it is asked for per job rather than raised for all five.
    permissions:
      contents: write

    env:
      # gh is on the runner image. GH_REPO is what lets it work without a checkout, which is the
      # only reason this job does not need one.
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Collect the executable
        uses: actions/download-artifact@v4
        with:
          name: lockstep-exe

      - name: Check what arrived
        run: |
          test -f Lockstep.exe || { echo "Lockstep.exe did not arrive from the package job."; exit 1; }
          ls -l Lockstep.exe
          sha256sum Lockstep.exe

      # Everything somebody needs before double-clicking it, including the two things this pipeline
      # cannot tell them. AGENTS.md §3: a green build says nothing about whether the game draws --
      # and no runner here has a GPU, so what is being published has never drawn a frame.
      - name: Write the notes
        run: |
          cat > notes.md <<'NOTES'
          `Lockstep.exe` is the whole game. Art, fonts and compiled shaders are inside the binary, so
          there is nothing to unpack and no folder to keep it in (`Design/README.md` §1).

          ### Before you run it

          - **Windows 11, x64**, and a GPU that does Direct3D 12.
          - The **[Microsoft Visual C++ Redistributable, x64](https://aka.ms/vc14/vc_redist.x64.exe)**.
            The build links the DLL runtime, so without it the executable will not start at all.
          - The binary is **unsigned**, so SmartScreen interrupts the first run: *More info →
            Run anyway*.

          ### What was checked, and what was not

          Five test suites pass, `clang-tidy` and `clang-format` are clean, and the scripted match
          still hashes to its pinned value under `Release` optimisation. Nobody launched this
          binary: GitHub's runners have no GPU, so it has been compiled and never drawn a frame.
          NOTES

      - name: Publish the versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" Lockstep.exe --title "$GITHUB_REF_NAME" --notes-file notes.md

      # Deleted and recreated rather than edited in place, because the TAG has to move to the commit
      # that was built and neither `gh` nor the API will move one under a release that already
      # exists. What does not move is the download URL, which is the part that gets linked:
      # .../releases/download/latest-build/Lockstep.exe
      #
      # The check afterwards is not ceremony. If --cleanup-tag leaves the tag behind, `create`
      # silently reuses it and ignores --target, and the release then serves today's executable
      # under a tag whose source zip is somebody else's commit.
      - name: Refresh the rolling build
        if: github.ref == 'refs/heads/main'
        run: |
          {
            echo
            echo "---"
            echo
            echo "Built from \`$GITHUB_SHA\` on $(date -u '+%Y-%m-%d %H:%M UTC'). This tag moves: it is"
            echo "whatever \`main\` last built, not a version. The link is stable; the bytes are not."
          } >> notes.md

          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build Lockstep.exe \
            --prerelease --target "$GITHUB_SHA" \
            --title "Latest main build" --notes-file notes.md

          tagged="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest-build" --jq .object.sha)"
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "latest-build points at $tagged, not $GITHUB_SHA: the old tag survived --cleanup-tag."
            exit 1
          fi
