name: Build

# CI for this repository (AGENTS.md §6). It builds FrontierOutpost.slnx at Debug|x64 for every pull
# request to main and every push to main.
#
# ── What it gates, and what it skips ───────────────────────────────────────────────────────────
#
# AGENTS.md §6 guards every gate on the file it needs, so a gate starts blocking the day its input
# lands, and a gate whose input does not exist yet is skipped, not faked:
#
#   Build/CheckProjectFiles.py   the build-shape check           runs
#   Build/CheckSounds.py         the sounds the game names       runs; only an unplayable WAV fails
#   FrontierOutpost.slnx         the build                       runs
#   *Tests.dll in the output     the test suites                 none yet: skipped
#   Build/RunClangTidy.py        clang-tidy                      runs
#   Build/CheckFormat.py         clang-format (its own job)      runs
#   Build/TestCheckers.py        the checkers' own tests         runs, in both jobs
#   launch.exe and lt.dll        the smoke job (its own job)     runs the apps brought up so far
#
# The checkers leave FrontierOutpost/ and GameData/ alone (ADR-001, ADR-004), so until NeuronClient
# lands they check almost nothing in this tree. TestCheckers.py is what shows they catch what they
# should: it runs each one against small trees that break each rule.
#
# ── Why the build does not treat warnings as errors ───────────────────────────────────────────
#
# FrontierOutpost/ is a legacy import. It builds at the original's /W3, with the original's own
# warnings (585 unique at C++23, every one of them the original's: MIGRATION_NOTES.md §21.4), and
# ADR-001 exempts it from /W4 /WX. MSBuild's /warnaserror would turn every one of them into an
# error, so it is not passed.
#
# ── What it does not build ─────────────────────────────────────────────────────────────────────
#
# Debug and x64 only (AGENTS.md §3, §6, MIGRATION_NOTES.md D21). Release and ARM64 are built
# before a release by whoever ships. The migration's own workflow built all four combinations
# while the migration lasted; it is gone, and MIGRATION_NOTES.md §20 and §22 keep what it
# measured.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Debug|x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # MSBuild through vswhere, as the migration brief asks, rather than from a setup action.
      - name: Find MSBuild and record the toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -prerelease -products * -property installationPath
          if (-not $install) { throw "vswhere found no Visual Studio installation." }
          $msbuild = & $vswhere -latest -prerelease -products * -requires Microsoft.Component.MSBuild `
            -find 'MSBuild\**\Bin\amd64\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw "vswhere found no MSBuild." }
          "MSBUILD_EXE=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "runner image : $env:ImageOS / $env:ImageVersion"
          Write-Output "visual studio: $install"
          Write-Output "msbuild      : $msbuild, version $(& $msbuild -version -nologo | Select-Object -Last 1)"

      - name: Check the build shape and the project registries
        if: hashFiles('Build/CheckProjectFiles.py') != ''
        shell: pwsh
        run: python Build\CheckProjectFiles.py

      - name: Check the sounds the game names
        if: hashFiles('Build/CheckSounds.py') != ''
        shell: pwsh
        run: python Build\CheckSounds.py

      - name: Build
        if: hashFiles('FrontierOutpost.slnx') != ''
        shell: pwsh
        run: |
          & $env:MSBUILD_EXE FrontierOutpost.slnx /p:Configuration=Debug /p:Platform=x64 `
            /m /nologo /v:minimal /clp:ErrorsOnly "/flp:LogFile=build.log;Verbosity=normal"
          $code = $LASTEXITCODE
          Select-String -Path build.log -Pattern '^\s*\d+ Warning\(s\)|^\s*\d+ Error\(s\)|^\s*Time Elapsed' |
            ForEach-Object { $_.Line.Trim() }
          if ($code -ne 0) { throw "MSBuild failed with exit code $code." }

      # vstest reports "no tests found" as a pass (AGENTS.md §3), so an empty run proves nothing:
      # the suites are found first, and there must be at least one.
      - name: Run the tests
        shell: pwsh
        run: |
          $suites = @(Get-ChildItem -Path FrontierOutpost\bin\x64\Debug, x64\Debug -Filter '*Tests.dll' `
            -File -ErrorAction SilentlyContinue | ForEach-Object FullName)
          if (-not $suites) {
            Write-Output "No test suite is built yet; nothing to run."
            exit 0
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere -latest -products * -find '**\vstest.console.exe' | Select-Object -First 1
          if (-not $vstest) { throw "vstest.console.exe not found." }
          & $vstest $suites /Platform:x64 /Logger:trx /ResultsDirectory:TestResults
          if ($LASTEXITCODE -ne 0) { throw "vstest reported failures." }

      # After the build, so that a compile error is reported as a compile error rather than as
      # linter findings about a file that does not parse.
      - name: Run clang-tidy
        if: hashFiles('Build/RunClangTidy.py') != ''
        shell: pwsh
        run: python Build\RunClangTidy.py

      # On Windows this also takes RunClangTidy.py through vcvarsall.bat and the SDK headers.
      - name: Test the checkers
        if: hashFiles('Build/TestCheckers.py') != ''
        shell: pwsh
        run: python Build\TestCheckers.py

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      # What the smoke job runs, with the PDBs that let a crash print its stack.
      - name: Upload the launcher
        uses: actions/upload-artifact@v4
        with:
          name: launch-x64-Debug
          path: |
            FrontierOutpost/bin/x64/Debug/launch.exe
            FrontierOutpost/bin/x64/Debug/launch.pdb
            FrontierOutpost/bin/x64/Debug/lt.dll
            FrontierOutpost/bin/x64/Debug/lt.pdb
          if-no-files-found: error

  # The smoke job (Design/Plan/NeuronClient-migration.md, Phase 4 step 7 and N15). Each app runs a
  # number of frames on WARP, Windows' software adapter, offscreen and with the Direct3D 12 debug
  # layer, and fails on an error the layer reports, a removed device, a fatal error, a crash or a
  # capture it did not save. It never makes a swap chain (plan section 7). A crash prints its
  # stack into the log (LTE/OS.h). The last frame of each app is uploaded for the owner, and
  # printed into the log, downscaled, by Build/LogFrame.py, for a session that cannot fetch
  # artefacts. The apps are those brought up so far: each joins as the bring-up step that shows it
  # lands (plan Phase 4 step 5).
  smoke:
    name: Smoke on WARP
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: launch-x64-Debug
          path: FrontierOutpost/bin/x64/Debug

      - name: Run the apps on WARP
        shell: pwsh
        run: |
          $apps = @('loading', 'ui')
          $frames = 30
          $minutesEach = 10
          $launch = Join-Path $PWD 'FrontierOutpost\bin\x64\Debug\launch.exe'
          $failed = @()
          foreach ($app in $apps) {
            Write-Output "::group::$app"
            $capture = "smoke-$app.png"
            $process = Start-Process -FilePath $launch `
              -ArgumentList $app, '--warp', '--frames', $frames, '--capture', $capture `
              -NoNewWindow -PassThru -RedirectStandardOutput "smoke-$app.log" -RedirectStandardError "smoke-$app.err"
            # Without its handle, a finished process's exit code reads as nothing.
            $null = $process.Handle
            if (-not $process.WaitForExit($minutesEach * 60000)) {
              $process.Kill()
              $process.WaitForExit()
              Write-Output "$app did not finish within $minutesEach minutes"
            }
            Get-Content "smoke-$app.log", "smoke-$app.err" -ErrorAction SilentlyContinue
            Write-Output "::endgroup::"
            Write-Output "$app exited with $($process.ExitCode)"
            if ($process.ExitCode -ne 0) { $failed += $app }
            if (Test-Path $capture) {
              python Build\LogFrame.py $capture
              if ($LASTEXITCODE -ne 0) { $failed += "$app's frame, which Build\LogFrame.py could not read" }
            }
          }
          if ($failed) { throw "The smoke run failed for: $($failed -join ', ')" }

      - name: Upload the captures and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: |
            smoke-*.png
            smoke-*.log
            smoke-*.err
          if-no-files-found: ignore

  format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Ubuntu's own Python refuses pip installs into itself; setup-python's does not.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The version Visual Studio 2026 bundles, so that CI and a developer's machine agree.
      - name: Check formatting
        if: hashFiles('Build/CheckFormat.py') != ''
        run: |
          pip install --disable-pip-version-check --quiet clang-format==22.1.3
          python Build/CheckFormat.py --clang-format clang-format

      # clang-tidy from pip too: Build/RunClangTidy.py needs 19 or newer.
      - name: Test the checkers
        if: hashFiles('Build/TestCheckers.py') != ''
        run: |
          pip install --disable-pip-version-check --quiet clang-format==22.1.3 clang-tidy==22.1.0
          python Build/TestCheckers.py --clang-format clang-format --clang-tidy clang-tidy
