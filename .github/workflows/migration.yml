name: Migration

# Build host for the ltheory-old -> FrontierOutpost migration (FrontierOutpost/MIGRATION_NOTES.md).
# The session doing the migration has no Windows toolchain, so every measurement and build gate the
# migration needs runs here, on pushes to the migration branch and nowhere else. It is a harness for
# the migration notes, not the repository's CI: build.yml stays what gates main.
#
# Phase 0 (reconnaissance) has two jobs:
#
#   toolchain  What the runner offers: Visual Studio, the MSVC toolsets and the platforms MSBuild
#              registers them for, the Windows SDKs, the language-standard switches cl.exe documents,
#              the ARM64 build tools, and which CMake knows the Visual Studio 2026 generator.
#
#   baseline   The ORIGINAL built as its author built it: upstream JoshParnell/ltheory-old at the
#              commit the committed ltheory-old-main/ was verified against, with its SFML submodule
#              and its LFS-tracked Windows libraries, configured by CMake with the Visual Studio 2026
#              generator and built Debug and Release. x64 is what the migration targets; Win32 is
#              what the original's own configure.py asks for, and so the only configuration it was
#              ever known to build in.
#
# A failed baseline build is a RESULT, not a harness failure: the build step reports it and the job
# stays green, so that red here always means the measurement itself did not happen.
#
# From Phase 1 on, a third job builds the migration's own product:
#
#   frontieroutpost  FrontierOutpost.slnx, hand-authored MSBuild, built from a clean checkout with
#                    command-line MSBuild found through vswhere, one job per platform and
#                    configuration. This one is a gate: a failed build fails the job. It also prints
#                    every project's compiler, librarian, linker and resource-compiler command line,
#                    which the baseline job prints for the original too, so the two builds can be
#                    compared switch by switch.
#
# The baseline measures something that does not change (a pinned upstream commit) and costs about
# forty runner-minutes, so it runs only for a commit whose message contains [baseline]. The
# toolchain record is half a minute and runs on every push, because the runner image moves.
#
# One more job is a one-off, and the only one here that writes to the repository:
#
#   assets           Replaces GameData's Git LFS pointer files with the original's real files, which
#                    this runner can fetch and the migration's session cannot, and pushes them to
#                    this branch as one commit (FrontierOutpost/MIGRATION_NOTES.md §22). Once nothing
#                    is left to replace it does nothing.

on:
  push:
    branches: [claude/exciting-bohr-bd5ear]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UPSTREAM_URL: https://github.com/JoshParnell/ltheory-old
  # Blob-identical to the committed ltheory-old-main/ apart from the ten entries MIGRATION_NOTES.md lists.
  UPSTREAM_SHA: 0535d46d04db78ecb2bcf532f79a8b366757bb3d
  VS_GENERATOR: Visual Studio 18 2026

jobs:
  toolchain:
    name: Toolchain
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Record Visual Studio, toolsets, SDKs, cl switches, ARM64 tools and CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Section([string] $_title) { Write-Output ''; Write-Output "=== $_title ===" }

          Section 'Runner'
          Write-Output "image: $env:ImageOS $env:ImageVersion"
          Write-Output "processor: $env:PROCESSOR_ARCHITECTURE, logical cores: $env:NUMBER_OF_PROCESSORS"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          Section 'Visual Studio instances (vswhere -all -prerelease)'
          & $vswhere -all -prerelease -products * -format json | ConvertFrom-Json | ForEach-Object {
            '{0} | {1} | {2} | {3}' -f $_.displayName, $_.installationVersion, $_.catalog.productDisplayVersion, $_.installationPath
          }
          $vs = & $vswhere -latest -prerelease -products * -property installationPath
          Write-Output "latest: $vs"

          Section 'MSVC toolsets on disk'
          $msvc = Join-Path $vs 'VC\Tools\MSVC'
          $toolVersions = @(Get-ChildItem $msvc -Directory | ForEach-Object Name)
          $toolVersions
          Get-ChildItem (Join-Path $vs 'VC\Auxiliary\Build') -Filter 'Microsoft.VCToolsVersion*.txt' | ForEach-Object {
            '{0}: {1}' -f $_.Name, (Get-Content $_.FullName -Raw).Trim()
          }

          Section 'MSBuild platform toolset registrations'
          Get-ChildItem (Join-Path $vs 'MSBuild\Microsoft\VC') -Directory | ForEach-Object {
            $root = $_
            foreach ($platform in 'Win32', 'x64', 'ARM64', 'ARM64EC') {
              $dir = Join-Path $root.FullName "Platforms\$platform\PlatformToolsets"
              if (Test-Path $dir) { '{0}\{1}: {2}' -f $root.Name, $platform, ((Get-ChildItem $dir -Directory | ForEach-Object Name) -join ', ') }
            }
          }

          Section 'Compilers and libraries per target'
          foreach ($version in $toolVersions) {
            foreach ($pair in 'Hostx64\x64', 'Hostx64\x86', 'Hostx64\arm64', 'Hostx86\x86') {
              '{0}  {1,-14} cl.exe {2}' -f $version, $pair, (Test-Path (Join-Path $msvc "$version\bin\$pair\cl.exe"))
            }
            foreach ($lib in 'x64', 'x86', 'arm64', 'arm64ec') {
              '{0}  lib\{1,-8} {2}' -f $version, $lib, (Test-Path (Join-Path $msvc "$version\lib\$lib"))
            }
          }

          Section 'Visual Studio components'
          foreach ($component in 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64',
                                 'Microsoft.VisualStudio.Component.VC.Tools.ARM64',
                                 'Microsoft.VisualStudio.Component.VC.Tools.ARM64EC',
                                 'Microsoft.VisualStudio.Component.VC.CMake.Project') {
            $hit = & $vswhere -latest -prerelease -products * -requires $component -property installationPath
            '{0,-56} {1}' -f $component, $(if ($hit) { 'installed' } else { 'not installed' })
          }

          Section 'Windows SDKs'
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"
          Get-ChildItem (Join-Path $kits 'Include') -Directory | Sort-Object Name | ForEach-Object {
            $v = $_.Name
            '{0}  um\x64 {1}  um\x86 {2}  um\arm64 {3}  ucrt\arm64 {4}' -f $v,
              (Test-Path "$kits\Lib\$v\um\x64\kernel32.lib"), (Test-Path "$kits\Lib\$v\um\x86\kernel32.lib"),
              (Test-Path "$kits\Lib\$v\um\arm64\kernel32.lib"), (Test-Path "$kits\Lib\$v\ucrt\arm64\ucrt.lib")
            foreach ($arch in 'x64', 'arm64') {
              '{0}  {1,-5} opengl32.lib {2}  glu32.lib {3}' -f $v, $arch,
                (Test-Path "$kits\Lib\$v\um\$arch\OpenGL32.lib"), (Test-Path "$kits\Lib\$v\um\$arch\GlU32.lib")
            }
          }

          Section 'cl /? (x64 host, x64 target): standard, conformance and /arch switches'
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          cmd /c "`"$devcmd`" -arch=amd64 -host_arch=amd64 -no_logo >nul && cl /? 2>&1" | Set-Content -Path cl-help-x64.txt
          Select-String -Path cl-help-x64.txt -Pattern 'Version|/std:|c\+\+2|/permissive|/Zc:__cplusplus|/arch:' | ForEach-Object { $_.Line.Trim() }

          Section 'C++23 switch probe: what each /std value does with a real translation unit'
          Set-Content -Path probe.cpp -Value @(
            '#include <cstdio>',
            'int main() { std::printf("_MSVC_LANG=%ld __cplusplus=%ld", (long)_MSVC_LANG, (long)__cplusplus); }')
          foreach ($std in '/std:c++20', '/std:c++23', '/std:c++23preview', '/std:c++latest') {
            $out = cmd /c "`"$devcmd`" -arch=amd64 -host_arch=amd64 -no_logo >nul && cl /nologo $std /Zc:__cplusplus /EHsc probe.cpp /Fe:probe.exe 2>&1 && probe.exe"
            '{0,-18} {1}' -f $std, (($out | Where-Object { $_ -and $_ -ne 'probe.cpp' }) -join ' | ')
          }
          # The property page rules spread an EnumValue's attributes over several lines, so they are
          # read as XML rather than grepped.
          $rule = Get-ChildItem (Join-Path $vs 'MSBuild\Microsoft\VC\v180') -Recurse -Filter 'cl.xml' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($rule) {
            "LanguageStandard values MSBuild offers ($($rule.FullName.Substring($vs.Length + 1))):"
            [xml] $xml = Get-Content -Path $rule.FullName -Raw
            $xml.SelectNodes("//*[local-name()='EnumProperty' and @Name='LanguageStandard']/*[local-name()='EnumValue']") |
              ForEach-Object {
                $switch = $_.GetAttribute('Switch')
                '    {0,-18} {1}' -f $_.GetAttribute('Name'), $(if ($switch) { '/' + $switch } else { '(compiler default)' })
              }
          }

          Section 'cl banner per target (x64 host)'
          foreach ($target in 'amd64', 'x86', 'arm64') {
            $banner = cmd /c "`"$devcmd`" -arch=$target -host_arch=amd64 -no_logo >nul && cl 2>&1"
            '{0,-6} {1}' -f $target, ($banner | Select-Object -First 1)
          }

          Section 'CMake'
          $bundled = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe'
          foreach ($cmake in @((Get-Command cmake -ErrorAction SilentlyContinue).Source, $bundled)) {
            if ($cmake -and (Test-Path $cmake)) {
              '{0}: {1}' -f $cmake, (& $cmake --version | Select-Object -First 1)
              & $cmake --help | Select-String 'Visual Studio 1[78]' | ForEach-Object { '    ' + $_.Line.Trim() }
            }
          }

          Section 'git'
          git --version
          git lfs version

      - name: Upload cl /? output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolchain
          path: cl-help-x64.txt
          if-no-files-found: ignore

  baseline:
    name: Baseline ${{ matrix.arch }}
    if: contains(github.event.head_commit.message, '[baseline]')
    runs-on: windows-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]

    env:
      ARCH: ${{ matrix.arch }}

    steps:
      # Only for the helper scripts: the original comes from upstream, not from this repository.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Clone the original with its SFML submodule and Windows libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Invoke-Checked([string] $_what, [scriptblock] $_command) {
            & $_command
            if ($LASTEXITCODE -ne 0) { throw "$_what failed with exit code $LASTEXITCODE" }
          }

          # LFS objects are fetched below for the paths the build needs, and only those: fonts,
          # sounds and textures are runtime content the baseline build does not read.
          $env:GIT_LFS_SKIP_SMUDGE = '1'
          $src = '_baseline_build/src'
          Invoke-Checked 'clone' { git clone --quiet --no-checkout $env:UPSTREAM_URL $src }
          Invoke-Checked 'checkout' { git -C $src -c advice.detachedHead=false checkout --quiet $env:UPSTREAM_SHA }
          git -C $src log -1 --format='original at %H (%ad) %s' --date=short

          $gitlink = (git -C $src ls-tree HEAD ext/SFML) -split '\s+'
          New-Item -ItemType Directory -Force "$src/ext/SFML" | Out-Null
          Invoke-Checked 'SFML init' { git -C "$src/ext/SFML" init --quiet }
          Invoke-Checked 'SFML fetch' { git -C "$src/ext/SFML" fetch --quiet --depth 1 https://github.com/SFML/SFML $gitlink[2] }
          Invoke-Checked 'SFML checkout' { git -C "$src/ext/SFML" -c advice.detachedHead=false checkout --quiet FETCH_HEAD }
          git -C "$src/ext/SFML" log -1 --format='SFML at %H (%ad) %s' --date=short

          git -C $src lfs pull --include 'extlib/win32/**,extbin/win32/**'
          Write-Output "git lfs pull exit code: $LASTEXITCODE"

          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -prerelease -products * -property installationPath
          $tools = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt" -Raw).Trim()
          $dumpbin = "$vs\VC\Tools\MSVC\$tools\bin\Hostx64\x64\dumpbin.exe"
          "DUMPBIN=$dumpbin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $root = (Resolve-Path $src).Path
          Write-Output '--- Windows prebuilt binaries: size and machine type ---'
          Get-ChildItem "$src/extlib/win32", "$src/extbin/win32" -Recurse -File | ForEach-Object {
            $bytes = [IO.File]::ReadAllBytes($_.FullName)
            $head = [Text.Encoding]::ASCII.GetString($bytes, 0, [Math]::Min(40, $bytes.Length))
            $machines = if ($head.StartsWith('version https://git-lfs')) { 'LFS POINTER, not fetched' } else {
              (& $dumpbin /headers $_.FullName | Select-String '(?i)machine\s*(?::\s*[0-9a-f]+\s*)?\((\w+)\)' |
                ForEach-Object { $_.Matches[0].Groups[1].Value } | Sort-Object -Unique) -join ','
            }
            '{0,-40} {1,12:N0} bytes  {2}' -f $_.FullName.Substring($root.Length + 1), $_.Length, $machines
          }
          Write-Output '--- Windows prebuilt DLLs: version resources ---'
          Get-ChildItem "$src/extbin/win32" -File | ForEach-Object {
            $info = $_.VersionInfo
            '{0,-16} FileVersion {1} | ProductVersion {2} | {3} | {4}' -f $_.Name, $info.FileVersion, $info.ProductVersion, $info.ProductName, $info.FileDescription
          }
          # A library that did not arrive shows up above and again as a link error; neither is a harness failure.
          exit 0

      - name: Configure (CMake, Visual Studio 2026 generator)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -prerelease -products * -property installationPath
          $bundled = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe'
          $cmake = $null
          foreach ($candidate in @((Get-Command cmake -ErrorAction SilentlyContinue).Source, $bundled)) {
            if (-not $candidate -or -not (Test-Path $candidate)) { continue }
            '{0}: {1}' -f $candidate, (& $candidate --version | Select-Object -First 1)
            if (-not $cmake -and (& $candidate --help | Out-String).Contains($env:VS_GENERATOR)) { $cmake = $candidate }
          }
          if (-not $cmake) {
            # A development tool, not a dependency of anything built (AGENTS.md R14).
            Write-Output "Neither CMake offers '$env:VS_GENERATOR'; installing the current one from PyPI."
            python -m pip install --disable-pip-version-check --quiet cmake
            $cmake = (Get-Command cmake).Source
            '{0}: {1}' -f $cmake, (& $cmake --version | Select-Object -First 1)
            if (-not (& $cmake --help | Out-String).Contains($env:VS_GENERATOR)) { throw "No CMake offers '$env:VS_GENERATOR'." }
          }
          Write-Output "using: $cmake"
          "CMAKE_EXE=$cmake" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # CMAKE_POLICY_VERSION_MINIMUM: CMake 4 refuses cmake_minimum_required below 3.5, and the
          # original says 3.0. The command line lifts the floor without touching the original.
          # Quoted: unquoted, PowerShell splits a native argument like -DX=3.5 at the dot.
          & $cmake -S _baseline_build/src -B _baseline_build/build -G $env:VS_GENERATOR -A $env:ARCH `
            '-DCMAKE_POLICY_VERSION_MINIMUM=3.5' *>&1 | Tee-Object -FilePath configure.log
          $code = $LASTEXITCODE
          Write-Output "configure exit code: $code"
          "CONFIGURE_EXIT=$code" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($code -ne 0) { Write-Output "::warning::Baseline $env:ARCH did not configure (exit code $code)." }
          exit 0

      - name: Build Debug and Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $summary = @("### Baseline $env:ARCH", '', '| Configuration | Exit code | Wall clock |', '|---|---|---|')
          if ($env:CONFIGURE_EXIT -ne '0') {
            Write-Output "Not built: configure exited with $env:CONFIGURE_EXIT."
            $summary + "| (all) | configure failed ($env:CONFIGURE_EXIT) | - |" + '' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }
          foreach ($cfg in 'Debug', 'Release') {
            # Absolute: cmake --build runs MSBuild from inside the build directory, so a relative
            # /flp path would put the log there instead of where the summary looks for it.
            $log = Join-Path $PWD "build-$env:ARCH-$cfg.log"
            $timer = [Diagnostics.Stopwatch]::StartNew()
            & $env:CMAKE_EXE --build _baseline_build/build --config $cfg -- /m /nologo /v:quiet /clp:ErrorsOnly "/flp:LogFile=$log;Verbosity=normal"
            $code = $LASTEXITCODE
            $elapsed = '{0:hh\:mm\:ss}' -f $timer.Elapsed
            Write-Output "== $env:ARCH ${cfg}: exit code $code, wall clock $elapsed"
            if ($code -ne 0) { Write-Output "::warning::Baseline $env:ARCH $cfg did not build (exit code $code)." }
            $summary += "| $cfg | $code | $elapsed |"

            # bin/ is shared by every configuration (the original's configure_output_dir), so each
            # configuration's outputs are listed before the next one overwrites them.
            Write-Output "-- outputs after $cfg --"
            Get-ChildItem _baseline_build/src/bin -File -ErrorAction SilentlyContinue | Sort-Object Name |
              ForEach-Object { '   bin/{0,-34} {1,14:N0}' -f $_.Name, $_.Length }
            Get-ChildItem _baseline_build/build/ext/SFML/lib -Recurse -File -ErrorAction SilentlyContinue | Sort-Object FullName |
              ForEach-Object { '   build/ext/SFML/lib/{0}/{1,-26} {2,14:N0}' -f $_.Directory.Name, $_.Name, $_.Length }

            # What each built binary loads at run time, and how many functions it takes from each DLL:
            # this is what says which FreeType the original actually runs, not the link line.
            foreach ($binary in 'lt.dll', 'launch.exe') {
              $path = "_baseline_build/src/bin/$binary"
              if (-not (Test-Path $path)) { continue }
              $current = $null
              $counts = [ordered]@{}
              foreach ($line in (& $env:DUMPBIN /imports $path)) {
                if ($line -match '^\s{4}(\S+\.dll)\s*$') { $current = $Matches[1]; $counts[$current] = 0 }
                elseif ($current -and $line -match '^\s+[0-9A-Fa-f]+\s+\S+\s*$') { $counts[$current]++ }
              }
              "   $binary imports: " + (($counts.GetEnumerator() | ForEach-Object { "$($_.Key) ($($_.Value))" }) -join ', ')
            }
          }
          $summary + '' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit 0

      - name: Summarize diagnostics and effective settings
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # Pointer truncation is the 64-bit hazard a grep cannot find; the compiler lists it.
          python .github/migration/SummarizeBuildLog.py --list C4311,C4302,C4312 `
            "$env:ARCH Debug=build-$env:ARCH-Debug.log" "$env:ARCH Release=build-$env:ARCH-Release.log"
          Write-Output ''
          Write-Output '=== Command lines per project (compare with the frontieroutpost job) ==='
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -prerelease -products * -property installationPath
          $tools = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt" -Raw).Trim()
          foreach ($cfg in 'Debug', 'Release') {
            Write-Output "--- $env:ARCH $cfg ---"
            python .github/migration/CommandLines.py --root "$env:GITHUB_WORKSPACE\_baseline_build\src=<src>" `
              --root "$env:GITHUB_WORKSPACE\_baseline_build\build=<build>" --root "$vs\VC\Tools\MSVC\$tools=<MSVC>" `
              --root "${env:ProgramFiles(x86)}\Windows Kits\10=<WindowsKits>" "build-$env:ARCH-$cfg.log"
          }
          Write-Output ''
          Write-Output '=== Projects in the generated solution ==='
          Get-ChildItem _baseline_build/build -Filter 'LTheory.sln*' -ErrorAction SilentlyContinue | ForEach-Object {
            Select-String -Path $_.FullName -Pattern '^Project\(|<Project ' | ForEach-Object { $_.Line.Trim() }
          }
          Write-Output ''
          Write-Output '=== Effective settings of the CMake-generated projects ==='
          # Source lists are identical for both architectures; one job prints them.
          $sources = if ($env:ARCH -eq 'x64') { '--sources' } else { '--no-sources' }
          python .github/migration/DescribeVcxproj.py $sources $env:GITHUB_WORKSPACE _baseline_build/build Debug Release
          Write-Output ''
          Write-Output '=== CMakeCache.txt, selected entries ==='
          Select-String -Path _baseline_build/build/CMakeCache.txt -ErrorAction SilentlyContinue `
            -Pattern '^(CMAKE_(C|CXX|RC)_FLAGS|CMAKE_(EXE|SHARED|STATIC|MODULE)_LINKER_FLAGS|CMAKE_GENERATOR|CMAKE_VS_|CMAKE_MSVC|CMAKE_SYSTEM_VERSION|CMAKE_CONFIGURATION_TYPES|CMAKE_POLICY|BUILD_SHARED_LIBS|SFML_|OPENGL_|GLEW_|EXECUTABLE_OUTPUT_PATH|LIBRARY_OUTPUT_PATH)' |
            ForEach-Object { $_.Line }

      - name: Upload logs and generated projects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ matrix.arch }}
          path: |
            configure.log
            build-*.log
            _baseline_build/build/CMakeCache.txt
            _baseline_build/build/*.vcxproj
            _baseline_build/build/LTheory.sln*
          if-no-files-found: ignore

  frontieroutpost:
    name: FrontierOutpost ${{ matrix.platform }} ${{ matrix.configuration }}
    runs-on: windows-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # ARM64 from Phase 4 (FrontierOutpost/MIGRATION_NOTES.md §19). The runner cross-compiles and
        # links it; it cannot run it (O4).
        platform: [x64, ARM64]
        configuration: [Debug, Release]

    env:
      # Not PLATFORM or CONFIGURATION: MSBuild reads every environment variable as a property.
      FO_PLATFORM: ${{ matrix.platform }}
      FO_CONFIGURATION: ${{ matrix.configuration }}

    steps:
      - uses: actions/checkout@v4

      - name: Build FrontierOutpost.slnx
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -prerelease -products * -property installationPath
          $msbuild = & $vswhere -latest -prerelease -products * -requires Microsoft.Component.MSBuild `
            -find 'MSBuild\**\Bin\amd64\MSBuild.exe' | Select-Object -First 1
          $tools = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt" -Raw).Trim()
          "MSVC_DIR=$vs\VC\Tools\MSVC\$tools" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $dumpbin = "$vs\VC\Tools\MSVC\$tools\bin\Hostx64\x64\dumpbin.exe"
          Write-Output "msbuild: $msbuild, version $(& $msbuild -version -nologo | Select-Object -Last 1)"
          Write-Output "MSVC: $tools"

          # The command the migration brief names, plus logging.
          $log = Join-Path $PWD "build-$env:FO_PLATFORM-$env:FO_CONFIGURATION.log"
          $timer = [Diagnostics.Stopwatch]::StartNew()
          & $msbuild FrontierOutpost.slnx /m /p:Configuration=$env:FO_CONFIGURATION /p:Platform=$env:FO_PLATFORM `
            /nologo /v:quiet /clp:ErrorsOnly "/flp:LogFile=$log;Verbosity=normal"
          $code = $LASTEXITCODE
          $elapsed = '{0:hh\:mm\:ss}' -f $timer.Elapsed
          Write-Output "== $env:FO_PLATFORM ${env:FO_CONFIGURATION}: exit code $code, wall clock $elapsed"
          @("### FrontierOutpost $env:FO_PLATFORM $env:FO_CONFIGURATION", '',
            "MSBuild exit code **$code**, wall clock **$elapsed** (clean checkout, ``/m`` on $env:NUMBER_OF_PROCESSORS logical cores).", '') |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          $out = "FrontierOutpost/bin/$env:FO_PLATFORM/$env:FO_CONFIGURATION"
          Write-Output "-- outputs in $out --"
          Get-ChildItem $out -File -ErrorAction SilentlyContinue | Sort-Object Name | ForEach-Object {
            $machine = ''
            if ($_.Extension -in '.dll', '.exe', '.lib') {
              $machine = & $dumpbin /headers $_.FullName | Select-String '(?i)machine\s*\((\w+)\)' |
                ForEach-Object { $_.Matches[0].Groups[1].Value } | Sort-Object -Unique | Join-String -Separator ','
            }
            '   {0,-34} {1,14:N0}  {2}' -f $_.Name, $_.Length, $machine
          }
          foreach ($binary in 'lt.dll', 'launch.exe') {
            $path = "$out/$binary"
            if (-not (Test-Path $path)) { continue }
            $current = $null
            $counts = [ordered]@{}
            foreach ($line in (& $dumpbin /imports $path)) {
              if ($line -match '^\s{4}(\S+\.dll)\s*$') { $current = $Matches[1]; $counts[$current] = 0 }
              elseif ($current -and $line -match '^\s+[0-9A-Fa-f]+\s+\S+\s*$') { $counts[$current]++ }
            }
            "   $binary imports: " + (($counts.GetEnumerator() | ForEach-Object { "$($_.Key) ($($_.Value))" }) -join ', ')
          }
          exit $code

      - name: Summarize diagnostics and command lines
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $log = "build-$env:FO_PLATFORM-$env:FO_CONFIGURATION.log"
          python .github/migration/SummarizeBuildLog.py --list C4311,C4302,C4312 "FrontierOutpost $env:FO_PLATFORM $env:FO_CONFIGURATION=$log"
          Write-Output ''
          Write-Output '=== Command lines per project (compare with the baseline job) ==='
          python .github/migration/CommandLines.py --root "$env:GITHUB_WORKSPACE\FrontierOutpost=<src>" `
            --root "$env:MSVC_DIR=<MSVC>" --root "${env:ProgramFiles(x86)}\Windows Kits\10=<WindowsKits>" $log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontieroutpost-${{ matrix.platform }}-${{ matrix.configuration }}
          path: |
            build-*.log
          if-no-files-found: ignore

  assets:
    name: Real asset files
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # To push the commit it makes, to this branch only; every other job reads.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Replace GameData's pointer files with the original's real files, and push them
        shell: bash
        run: |
          set -euo pipefail
          # The clone's LFS files stay pointers until RealAssets.py fetches the ones it needs.
          export GIT_LFS_SKIP_SMUDGE=1
          upstream="$RUNNER_TEMP/upstream"
          git clone --quiet --no-checkout "$UPSTREAM_URL" "$upstream"
          git -C "$upstream" -c advice.detachedHead=false checkout --quiet "$UPSTREAM_SHA"

          # The 79 Ogg sounds are left as pointers for the owner to decide (MIGRATION_NOTES.md §22,
          # D16, O13).
          message="$RUNNER_TEMP/message.txt"
          python3 .github/migration/RealAssets.py --upstream "$upstream" --sha "$UPSTREAM_SHA" --fetch \
            --skip-suffix .ogg --message "$message"
          if [ ! -f "$message" ]; then exit 0; fi

          # Authored, and signed off, as the commit this run builds.
          git log -1 --format='%(trailers:key=Co-Authored-By,key=Claude-Session)' "$GITHUB_SHA" >> "$message"
          git -c user.name="$(git log -1 --format=%an "$GITHUB_SHA")" \
            -c user.email="$(git log -1 --format=%ae "$GITHUB_SHA")" commit --quiet --file "$message"
          git log -1 --format='%H%n%B'
          git show --stat --format= HEAD | tail -n 1
          # A fast-forward from the commit this run builds, never a force: if the branch has moved
          # on meanwhile, the push is refused and the job fails.
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
