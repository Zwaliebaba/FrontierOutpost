name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust · fmt, clippy, test, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the exact toolchain and components from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p frontier-sim-wasm --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Generated TypeScript protocol is committed
        run: |
          changes="$(git status --porcelain -- client/src/protocol/generated)"
          if [ -n "$changes" ]; then
            echo "::error::client/src/protocol/generated is stale. Run 'cargo test' and commit the result."
            echo "$changes"
            git diff -- client/src/protocol/generated
            exit 1
          fi
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  rust-windows:
    name: Rust · test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  client:
    name: Client · format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      # The client loads frontier-sim compiled to WebAssembly, so it needs the Rust toolchain
      # and the wasm-bindgen tool at the version pinned in Cargo.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - uses: actions/setup-node@v7
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build:sim
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End to end · browser against the server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - uses: actions/setup-node@v7
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      # Builds the WebAssembly simulation first (prebuild).
      - run: npm run build
        working-directory: client
      - run: cargo build --locked -p frontier-server
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npm run e2e
        working-directory: client

  repo:
    name: Repository · LFS and line endings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Binary assets are Git LFS pointers
        run: git lfs fsck --pointers
      - name: No CRLF text in the index
        run: |
          crlf="$(git ls-files --eol | awk '$1 == "i/crlf" || $1 == "i/mixed" { print $NF }')"
          if [ -n "$crlf" ]; then
            echo "::error::These files are committed with CRLF line endings:"
            echo "$crlf"
            exit 1
          fi
