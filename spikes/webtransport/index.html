<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebTransport spike</title>
    <style>
      body {
        margin: 24px;
        background: #0b1220;
        color: #d7deea;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      table {
        border-collapse: collapse;
        margin: 12px 0;
      }
      td,
      th {
        padding: 4px 14px 4px 0;
        text-align: left;
        vertical-align: top;
      }
      th {
        color: #9fb0c8;
        font-weight: 400;
      }
      .pass {
        color: #7fd1a0;
      }
      .fail {
        color: #f0a35e;
      }
      pre {
        padding: 12px;
        background: #101a2c;
        border: 1px solid #23324d;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>WebTransport spike</h1>
    <p id="link"></p>
    <p id="status">Running…</p>
    <table id="table"></table>
    <p>Copy the block below into the results table in the spike's README.</p>
    <pre id="result"></pre>
    <script type="module">
      // Filled in by the server on every start.
      const CERT_HASH = "__CERT_HASH__";
      // `?impaired` goes through the server's relay, which delays and drops packets.
      const IMPAIRED = new URLSearchParams(location.search).has("impaired");
      const LINK = IMPAIRED
        ? "impaired: __RELAY_DELAY_MS__ ms each way, __RELAY_LOSS_PERCENT__% loss each way"
        : "direct loopback";
      const URL = `https://127.0.0.1:${IMPAIRED ? "__RELAY_PORT__" : "__QUIC_PORT__"}/`;

      // What the game would send: 20 snapshots a second.
      const HZ = 20;
      const COUNT = 100;
      // The review's estimate of an unoptimised JSON snapshot, and a size that fits a datagram.
      const SNAPSHOT_BYTES = 6000;
      const DATAGRAM_BYTES = 1000;

      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const encoder = new TextEncoder();
      const decoder = new TextDecoder();
      const hexToBytes = (hex) =>
        Uint8Array.from(hex.match(/../g) ?? [], (pair) => Number.parseInt(pair, 16));
      const sequenceOf = (bytes) => new DataView(bytes.buffer, bytes.byteOffset).getUint32(0);
      const withSequence = (sequence, size) => {
        const bytes = new Uint8Array(size).fill(46);
        new DataView(bytes.buffer).setUint32(0, sequence);
        return bytes;
      };

      function stats(values) {
        if (values.length === 0) return null;
        const sorted = [...values].sort((a, b) => a - b);
        const round = (value) => Math.round(value * 10) / 10;
        return {
          median: round(sorted[Math.floor(sorted.length / 2)]),
          p95: round(sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * 0.95))]),
          max: round(sorted[sorted.length - 1]),
        };
      }

      /** One request and its reply on a bidirectional stream of their own. */
      async function request(transport, bytes) {
        const stream = await transport.createBidirectionalStream();
        const writer = stream.writable.getWriter();
        await writer.write(bytes);
        await writer.close();
        return new Uint8Array(await new Response(stream.readable).arrayBuffer());
      }

      async function streamEcho(transport, size, repeats) {
        const times = [];
        let intact = true;
        for (let i = 0; i < repeats; i += 1) {
          const payload = withSequence(i, size);
          const started = performance.now();
          const reply = await request(transport, payload);
          times.push(performance.now() - started);
          intact &&= reply.length === size && sequenceOf(reply) === i;
        }
        return { bytes: size, repeats, intact, roundTripMs: stats(times) };
      }

      // Cancelling a reader on `datagrams.readable` closes it for good, so one reader pumps for
      // the whole session and each test borrows it.
      let datagramSink = null;
      async function pumpDatagrams(transport) {
        const reader = transport.datagrams.readable.getReader();
        for (;;) {
          const { value, done } = await reader.read();
          if (done) return;
          datagramSink?.push({ at: performance.now(), bytes: value });
        }
      }

      function collectDatagrams() {
        const arrivals = [];
        datagramSink = arrivals;
        return {
          arrivals,
          stop() {
            datagramSink = null;
          },
        };
      }

      async function datagramEcho(transport) {
        const collector = collectDatagrams();
        const writer = transport.datagrams.writable.getWriter();
        const sentAt = new Map();
        for (let i = 0; i < COUNT; i += 1) {
          sentAt.set(i, performance.now());
          await writer.write(withSequence(i, 200));
          await sleep(1000 / HZ);
        }
        await sleep(500);
        writer.releaseLock();
        collector.stop();
        const times = collector.arrivals.map(
          ({ at, bytes }) => at - (sentAt.get(sequenceOf(bytes)) ?? at),
        );
        return { sent: COUNT, returned: collector.arrivals.length, roundTripMs: stats(times) };
      }

      async function oversizeDatagram(transport) {
        const collector = collectDatagrams();
        const writer = transport.datagrams.writable.getWriter();
        let outcome;
        try {
          await writer.write(withSequence(7, SNAPSHOT_BYTES));
          await sleep(500);
          outcome = collector.arrivals.length > 0 ? "delivered" : "silently dropped";
        } catch (error) {
          outcome = `rejected: ${error.message}`;
        }
        writer.releaseLock();
        collector.stop();
        return { bytes: SNAPSHOT_BYTES, outcome };
      }

      const intervals = (arrivals) => arrivals.slice(1).map((at, index) => at - arrivals[index]);

      async function pushedDatagrams(transport) {
        const collector = collectDatagrams();
        const command = `push dgram ${COUNT} ${DATAGRAM_BYTES} ${HZ}`;
        const reply = decoder.decode(await request(transport, encoder.encode(command)));
        await sleep(500);
        collector.stop();
        const sequences = collector.arrivals.map(({ bytes }) => sequenceOf(bytes));
        return {
          bytes: DATAGRAM_BYTES,
          server: reply,
          received: collector.arrivals.length,
          inOrder: sequences.every((value, index) => index === 0 || value > sequences[index - 1]),
          intervalMs: stats(intervals(collector.arrivals.map(({ at }) => at))),
          hitches: hitches(intervals(collector.arrivals.map(({ at }) => at))),
        };
      }

      /** How many gaps were long enough to be seen as a hitch: over two snapshot periods. */
      const hitches = (gaps) => gaps.filter((gap) => gap > (2 * 1000) / HZ).length;

      /** Each message on a stream of its own; streams are read as they arrive, not in turn. */
      async function pushedStreams(transport) {
        const reader = transport.incomingUnidirectionalStreams.getReader();
        const arrivals = [];
        let complete = true;
        const pending = [];
        const accepting = (async () => {
          for (let accepted = 0; accepted < COUNT; accepted += 1) {
            const { value: stream, done } = await reader.read();
            if (done) break;
            pending.push(
              new Response(stream).arrayBuffer().then((buffer) => {
                arrivals.push(performance.now());
                complete &&= buffer.byteLength === SNAPSHOT_BYTES;
              }),
            );
          }
          await Promise.all(pending);
        })();
        const command = `push uni ${COUNT} ${SNAPSHOT_BYTES} ${HZ}`;
        const reply = decoder.decode(await request(transport, encoder.encode(command)));
        await Promise.race([accepting, sleep(5000)]);
        reader.releaseLock();
        const gaps = intervals(arrivals.sort((a, b) => a - b));
        return {
          bytes: SNAPSHOT_BYTES,
          server: reply,
          received: arrivals.length,
          complete,
          intervalMs: stats(gaps),
          hitches: hitches(gaps),
        };
      }

      /** Every message on one ordered stream, which is how a WebSocket would carry them. */
      async function pushedOneStream(transport) {
        const reader = transport.incomingUnidirectionalStreams.getReader();
        const arrivals = [];
        const reading = (async () => {
          const { value: stream, done } = await reader.read();
          if (done) return;
          const bytes = stream.getReader();
          let total = 0;
          for (;;) {
            const { value, done: ended } = await bytes.read();
            if (ended) break;
            total += value.length;
            while (arrivals.length < Math.floor(total / SNAPSHOT_BYTES)) {
              arrivals.push(performance.now());
            }
          }
        })();
        const command = `push one ${COUNT} ${SNAPSHOT_BYTES} ${HZ}`;
        const reply = decoder.decode(await request(transport, encoder.encode(command)));
        await Promise.race([reading, sleep(5000)]);
        reader.releaseLock();
        const gaps = intervals(arrivals);
        return {
          bytes: SNAPSHOT_BYTES,
          server: reply,
          received: arrivals.length,
          intervalMs: stats(gaps),
          hitches: hitches(gaps),
        };
      }

      async function run() {
        const result = {
          userAgent: navigator.userAgent,
          link: LINK,
          supported: "WebTransport" in window,
        };
        if (!result.supported) return result;

        const started = performance.now();
        const transport = new WebTransport(URL, {
          serverCertificateHashes: [{ algorithm: "sha-256", value: hexToBytes(CERT_HASH) }],
        });
        try {
          await transport.ready;
        } catch (error) {
          result.connect = { ok: false, error: String(error) };
          return result;
        }
        result.connect = { ok: true, ms: Math.round(performance.now() - started) };
        result.maxDatagramBytes = transport.datagrams.maxDatagramSize;
        pumpDatagrams(transport).catch(() => {});

        const steps = {
          streamEchoSmall: () => streamEcho(transport, 200, 20),
          streamEchoSnapshot: () => streamEcho(transport, SNAPSHOT_BYTES, 20),
          streamEchoLarge: () => streamEcho(transport, 60_000, 5),
          datagramEcho: () => datagramEcho(transport),
          oversizeDatagram: () => oversizeDatagram(transport),
          pushedDatagrams: () => pushedDatagrams(transport),
          pushedStreams: () => pushedStreams(transport),
          pushedOneStream: () => pushedOneStream(transport),
        };
        for (const [name, step] of Object.entries(steps)) {
          document.getElementById("status").textContent = `Running ${name}…`;
          try {
            result[name] = await step();
          } catch (error) {
            result[name] = { error: String(error) };
          }
        }
        transport.close();
        return result;
      }

      function verdicts(result) {
        if (!result.supported) return [["WebTransport available", false, "not in this browser"]];
        const rows = [
          ["WebTransport available", true, ""],
          [
            "Connects with a pinned local certificate",
            result.connect.ok,
            result.connect.ok ? `${result.connect.ms} ms` : result.connect.error,
          ],
        ];
        if (!result.connect.ok) return rows;
        const describe = (value) => (value ? JSON.stringify(value) : "no data");
        rows.push(
          [
            "Stream echo, 200 bytes",
            result.streamEchoSmall.intact === true,
            describe(result.streamEchoSmall.roundTripMs ?? result.streamEchoSmall),
          ],
          [
            `Stream echo, ${SNAPSHOT_BYTES} bytes`,
            result.streamEchoSnapshot.intact === true,
            describe(result.streamEchoSnapshot.roundTripMs ?? result.streamEchoSnapshot),
          ],
          [
            "Stream echo, 60,000 bytes",
            result.streamEchoLarge.intact === true,
            describe(result.streamEchoLarge.roundTripMs ?? result.streamEchoLarge),
          ],
          [
            "Datagram echo at 20 per second",
            // Datagrams are meant to be lost on a lossy link, so there it is information only.
            IMPAIRED ? null : result.datagramEcho.returned >= COUNT * 0.95,
            `${result.datagramEcho.returned} of ${COUNT} returned, ${describe(result.datagramEcho.roundTripMs)}`,
          ],
          [
            `Server pushes ${DATAGRAM_BYTES}-byte datagrams at 20 per second`,
            IMPAIRED ? null : result.pushedDatagrams.received >= COUNT * 0.95,
            `${result.pushedDatagrams.received} of ${COUNT}, ${result.pushedDatagrams.hitches} hitches, interval ${describe(result.pushedDatagrams.intervalMs)}`,
          ],
          [
            `Server pushes ${SNAPSHOT_BYTES}-byte messages, one stream each`,
            result.pushedStreams.received === COUNT && result.pushedStreams.complete === true,
            `${result.pushedStreams.received} of ${COUNT}, ${result.pushedStreams.hitches} hitches, interval ${describe(result.pushedStreams.intervalMs)}`,
          ],
          [
            `Server pushes ${SNAPSHOT_BYTES}-byte messages on one ordered stream`,
            result.pushedOneStream.received === COUNT,
            `${result.pushedOneStream.received} of ${COUNT}, ${result.pushedOneStream.hitches} hitches, interval ${describe(result.pushedOneStream.intervalMs)}`,
          ],
          [
            `A ${SNAPSHOT_BYTES}-byte datagram (limit ${result.maxDatagramBytes})`,
            null,
            result.oversizeDatagram.outcome ?? describe(result.oversizeDatagram),
          ],
        );
        return rows;
      }

      document.getElementById("link").textContent = `Link: ${LINK}`;
      const result = await run();
      const rows = verdicts(result);
      const table = document.getElementById("table");
      for (const [label, ok, detail] of rows) {
        const row = table.insertRow();
        row.insertCell().textContent = label;
        const verdict = row.insertCell();
        verdict.textContent = ok === null ? "info" : ok ? "pass" : "fail";
        verdict.className = ok === null ? "" : ok ? "pass" : "fail";
        row.insertCell().textContent = detail;
      }
      const failed = rows.some(([, ok]) => ok === false);
      document.getElementById("status").textContent = failed
        ? "Finished with failures."
        : "Finished: every check passed.";
      document.getElementById("result").textContent = JSON.stringify(result, null, 2);
      window.spikeResult = result;
    </script>
  </body>
</html>
