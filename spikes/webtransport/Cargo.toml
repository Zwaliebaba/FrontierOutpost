[package]
name = "webtransport-spike"
description = "Throwaway spike: can a browser exchange streams and datagrams with a quinn-based WebTransport server?"
version = "0.0.0"
edition = "2024"
publish = false

# A workspace of its own, so the spike's dependencies stay out of the game's Cargo.lock and CI.
[workspace]

[dependencies]
anyhow = "1"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
web-transport-quinn = { version = "0.13", default-features = false, features = ["ring"] }
bytes = "1"
