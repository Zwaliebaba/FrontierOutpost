# CI and every developer use exactly this toolchain, so a green local
# `cargo clippy` / `cargo fmt` means a green CI. Bump it in its own PR.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
# The browser client runs frontier-sim compiled to WebAssembly (crates/sim-wasm).
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
