[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
frontier-protocol = { path = "crates/protocol" }
frontier-sim = { path = "crates/sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"

# Server runtime and networking (AGENTS.md section 8). The `ring` crypto backend builds on
# Windows without extra tools; aws-lc-rs, the crates' default, does not.
axum = "0.8"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["std"] }
time = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Persistence and identity (AGENTS.md section 8). SQLite is compiled in, so no system library.
getrandom = "0.4"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.11"
# Pure Rust from 0.6: no OpenSSL to install in CI or the container.
webauthn-rs = "0.6"
# Tests only: a software passkey to register and sign in with.
webauthn-authenticator-rs = { version = "0.6", features = ["softpasskey"] }
url = "2"
# Pinned exactly: the wasm-bindgen command-line tool must be the same version.
wasm-bindgen = "=0.2.130"
web-transport-quinn = { version = "0.13", default-features = false, features = ["ring"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

# The server does arithmetic on numbers a client chose. A release build that
# wraps where a debug build panics hides the bug from every test and can mint
# currency, so the shipped profile checks too. Measured cost on the caps
# benchmark: none.
[profile.release]
overflow-checks = true
